name: Build Android APKs

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build & Release APKs
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'gradle'

      - name: Accept Android SDK Licenses
        run: |
          mkdir -p "$ANDROID_HOME/licenses" || true
          echo "24333f8a63b6825ea9c5514f83c2829b004d1fee" >> "$ANDROID_HOME/licenses/android-sdk-license"
          echo "84831b9409646a918e30573bab4c9c91346d8abd" >> "$ANDROID_HOME/licenses/android-sdk-preview-license"
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true

      - name: Grant Execute Permissions for Gradle Wrapper
        run: |
          chmod +x wissel-info/gradlew
          chmod +x rheurdt-info/gradlew

      - name: Build Wissel Info APK
        run: |
          cd wissel-info
          ./gradlew assembleDebug --no-daemon

      - name: Build Rheurdt Info APK
        run: |
          cd rheurdt-info
          ./gradlew assembleDebug --no-daemon

      - name: Package & Prepare Downloadable Artifacts
        run: |
          mkdir -p dist
          cp wissel-info/app/build/outputs/apk/debug/app-debug.apk dist/WisselInfo-debug.apk
          cp rheurdt-info/app/build/outputs/apk/debug/app-debug.apk dist/RheurdtInfo-debug.apk
          ls -lh dist/

      - name: Upload APKs as Workflow Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Wissel-and-Rheurdt-APKs
          path: dist/*.apk
          retention-days: 30

      - name: Publish or Update Rolling Release
        uses: ncipollo/release-action@v1
        continue-on-error: true
        with:
          allowUpdates: true
          tag: "latest"
          name: "Neueste APK-Builds (v2.2.0)"
          body: |
            Automatischer Build für Commit ${{ github.sha }} (Branch: `${{ github.ref_name }}`).
            
            ### 📱 Direkter APK-Download auf dein Smartphone:
            * [WisselInfo-debug.apk](https://github.com/burzelmann/WisselRheurdtInfo/releases/download/latest/WisselInfo-debug.apk)
            * [RheurdtInfo-debug.apk](https://github.com/burzelmann/WisselRheurdtInfo/releases/download/latest/RheurdtInfo-debug.apk)
          artifacts: "dist/*.apk"
          makeLatest: true
        if: github.ref == 'refs/heads/main'
